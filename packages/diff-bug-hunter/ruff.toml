line-length = 130
target-version = "py310"
extend-exclude = ["tests/hunt_fixtures/jestdeps"]

[lint]
# Pyflakes, pycodestyle, bugbear, imports, pyupgrade, simplify, plus the checks that catch silent failures:
# subprocess.run without check, blind except, unused noqa, non-executable shebangs.
select = ["E", "F", "W", "B", "I", "UP", "SIM", "C4", "PIE", "ISC", "DTZ", "BLE", "EXE", "PLW1510", "TRY004", "RUF100", "RUF059"]
ignore = ["E501", "C408", "UP031"]  # long prompt strings, dict() calls, %-format: style only

[lint.per-file-ignores]
# entry scripts set bytecode guards / sys.path before importing sibling skill modules
".claude/skills/hunt/scripts/*.py" = ["E402"]
"eval/*.py" = ["E402"]
