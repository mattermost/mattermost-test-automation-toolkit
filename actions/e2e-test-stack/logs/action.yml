---
name: E2E test stack logs
description: >-
  Collect the logs of every server still up in a run's e2e-test-stack batch, this run's or another's, with every known
  secret taken out, and upload them as one artifact. Assumes role-arn itself: the job needs id-token: write and
  actions: read, and Node 26 set up first.
author: Mattermost
inputs:
  caller-key:
    description: The repository's key in the control plane's callers (e.g. mobile), as create was given it
    required: true
  batch:
    description: The batch within the run, as create was given it (e.g. ios)
    required: true
  role-arn:
    description: >-
      The repository's CI role ARN in the account the batch was created in, as create was given it,
      arn:aws:iam::<account id>:role/e2e-test-stack-ci-<caller-key>
    required: true
  channel:
    description: v1 (the default) or edge, as create was given it
    default: v1
  credentials-key:
    description: >-
      The repository's credentials key, a base64 X25519 private key (the E2E_TEST_STACK_CREDENTIALS_KEY secret), which
      opens the batch's token and each log's URL
    required: true
  run-id:
    description: >-
      The run whose batch's logs to collect; empty is this run. Another run must match allowed-workflows,
      allowed-branches and allowed-events, all three required for it
    default: ""
  allowed-workflows:
    description: For another run-id. Comma- or newline-separated workflow files (.github/workflows/<file>) it may be of
    default: ""
  allowed-branches:
    description: For another run-id. A JavaScript regular expression its whole head branch must match (e.g. main|release-.*)
    default: ""
  allowed-events:
    description: For another run-id. Comma-separated events it may be for (e.g. push, workflow_dispatch)
    default: ""
  artifact-prefix:
    description: >-
      The uploaded artifact is <artifact-prefix>-<batch>-<run attempt>, or <artifact-prefix>-<batch>-run-<run-id>-<run
      attempt> for another run; e2e-test-stack-logs unless set. Letters, digits, '.', '_' and '-'
    default: e2e-test-stack-logs
  github-token:
    description: The token for api.github.com, which reads the run and its artifacts; it needs actions read
    default: ${{ github.token }}
outputs:
  servers:
    description: >-
      JSON array, one entry per server that was up: index, instance_id, path (the full log, or its tail when the full
      log was not saved; empty when neither was), full and containers
    value: ${{ steps.logs.outputs.servers }}
  logs-dir:
    description: The directory holding the logs, server-<index>.log each; empty when none was saved
    value: ${{ steps.logs.outputs.logs_dir }}
  artifact-name:
    description: The uploaded artifact's name; empty unless the upload succeeded
    value: ${{ steps.upload.outputs.artifact-id != '' && steps.logs.outputs.artifact_name || '' }}
runs:
  using: composite
  steps:
    - id: logs
      shell: bash
      env:
        STACK_CALLER_KEY: ${{ inputs.caller-key }}
        STACK_BATCH: ${{ inputs.batch }}
        STACK_ROLE_ARN: ${{ inputs.role-arn }}
        STACK_CHANNEL: ${{ inputs.channel }}
        STACK_CREDENTIALS_KEY: ${{ inputs.credentials-key }}
        STACK_RUN_ID: ${{ inputs.run-id }}
        STACK_ALLOWED_WORKFLOWS: ${{ inputs.allowed-workflows }}
        STACK_ALLOWED_BRANCHES: ${{ inputs.allowed-branches }}
        STACK_ALLOWED_EVENTS: ${{ inputs.allowed-events }}
        STACK_ARTIFACT_PREFIX: ${{ inputs.artifact-prefix }}
        STACK_GITHUB_TOKEN: ${{ inputs.github-token }}
      run: bash "${{ github.action_path }}/../run.sh" logs
    # Whatever was saved, the full log or its tail, even when the step failed.
    - id: upload
      if: always() && steps.logs.outputs.artifact_name != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: ${{ steps.logs.outputs.artifact_name }}
        path: ${{ steps.logs.outputs.logs_dir }}
        if-no-files-found: error
        retention-days: 14
        # A second collection in the same attempt replaces the first's.
        overwrite: true
