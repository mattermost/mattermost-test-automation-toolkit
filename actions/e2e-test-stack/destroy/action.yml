---
name: E2E test stack destroy
description: >-
  Destroy every attempt's e2e-test-stack batch of a run, this run's or another's, from each attempt's create response:
  check that every site, mail and SSO host is gone and that a second destroy finds nothing. Assumes role-arn itself:
  the job needs id-token: write and actions: read, and Node 26 set up first.
author: Mattermost
inputs:
  caller-key:
    description: The repository's key in the control plane's callers (e.g. mobile), as create was given it
    required: true
  batch:
    description: The batch within the run, as create was given it (e.g. ios)
    required: true
  role-arn:
    description: >-
      The repository's CI role ARN in the account the batch was created in, as create was given it,
      arn:aws:iam::<account id>:role/e2e-test-stack-ci-<caller-key>
    required: true
  channel:
    description: v1 (the default) or edge, as create was given it
    default: v1
  credentials-key:
    description: >-
      The repository's credentials key, a base64 X25519 private key (the E2E_TEST_STACK_CREDENTIALS_KEY secret), which
      opens each batch's token
    required: true
  run-id:
    description: >-
      The run whose batches to destroy; empty is this run. Another run must match allowed-workflows, allowed-branches
      and allowed-events, all three required for it
    default: ""
  allowed-workflows:
    description: For another run-id. Comma- or newline-separated workflow files (.github/workflows/<file>) it may be of
    default: ""
  allowed-branches:
    description: For another run-id. A JavaScript regular expression its whole head branch must match (e.g. main|release-.*)
    default: ""
  allowed-events:
    description: For another run-id. Comma-separated events it may be for (e.g. push, workflow_dispatch)
    default: ""
  gone-window:
    description: Seconds each host has to stop being served once its batch is destroyed; 180 (the default) to 1800
    default: "180"
  github-token:
    description: The token for api.github.com, which reads the run and its artifacts; it needs actions read
    default: ${{ github.token }}
outputs:
  attempts:
    description: >-
      JSON array, one entry per attempt with a batch: attempt, batch_id, state (the destroy's reported state, such as
      destroyed, "not found" or partially_destroyed; "unknown" when a reply named none; "not destroyed" when no
      destroy answered or none was sent), gone, again (the second destroy's state, "unknown", "failed" or "not run")
      and cost_usd
    value: ${{ steps.destroy.outputs.attempts }}
  cost-usd:
    description: >-
      The batches' estimated cost in USD; empty unless every batch this step destroyed had every server priced at a
      known rate
    value: ${{ steps.destroy.outputs.cost_usd }}
runs:
  using: composite
  steps:
    - id: destroy
      shell: bash
      env:
        STACK_CALLER_KEY: ${{ inputs.caller-key }}
        STACK_BATCH: ${{ inputs.batch }}
        STACK_ROLE_ARN: ${{ inputs.role-arn }}
        STACK_CHANNEL: ${{ inputs.channel }}
        STACK_CREDENTIALS_KEY: ${{ inputs.credentials-key }}
        STACK_RUN_ID: ${{ inputs.run-id }}
        STACK_ALLOWED_WORKFLOWS: ${{ inputs.allowed-workflows }}
        STACK_ALLOWED_BRANCHES: ${{ inputs.allowed-branches }}
        STACK_ALLOWED_EVENTS: ${{ inputs.allowed-events }}
        STACK_GONE_WINDOW: ${{ inputs.gone-window }}
        STACK_GITHUB_TOKEN: ${{ inputs.github-token }}
      run: bash "${{ github.action_path }}/../run.sh" destroy
