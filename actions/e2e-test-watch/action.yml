name: E2E test watch
description: >
  After a trunk E2E run, find the failures that repeat (broken twice in a row, or
  flaky) and the agent's own PRs that no longer merge into trunk, and output one
  request per fix for the caller to send to its fixing agent. Pair it with
  actions/e2e-test-watch/record after sending.
author: Mattermost
inputs:
  repository:
    description: owner/repo of the run
    required: true
  gh-run-id:
    description: Workflow run id of the trunk E2E run
    required: true
  gh-run-attempt:
    description: Attempt of that run
    required: false
    default: "1"
  branch:
    description: Trunk branch; suites the run reported for any other branch are ignored
    required: false
    default: master
  suites:
    description: 'JSON list of the run''s suites: [{"name": "<TSIO report group name>", "test_root": "<spec root>", "report_name": "<optional prefix>"}]'
    required: true
  github-token:
    description: Token to read PRs (dedupe, suspect commits); never sent elsewhere
    required: true
  label:
    description: Label the agent puts on its PRs; used to find them, and passed in each request
    required: false
    default: e2e-autofix
  extra-labels:
    description: Comma-separated labels the agent's PR should also carry (e.g. AI/babysit)
    required: false
    default: ""
  max-broken-per-run:
    description: Safety limit on broken-spec requests per trunk run; breaks are otherwise all sent at once
    required: false
    default: "10"
  max-flaky-per-day:
    description: Flaky-spec requests sent in any 24 hours, most-flaky first
    required: false
    default: "6"
  cause-hold-hours:
    description: Hours a break whose suspect commits overlap one already requested waits for that agent to open its PR
    required: false
    default: "4"
  tsio-base-url:
    description: Test System IO base URL; empty for the shared instance
    required: false
    default: ""
outputs:
  requests-file:
    description: 'Path of a JSON list [{"id", "payload"}]: send each payload, then pass [{"id", "status"}] to the record action'
    value: ${{ github.workspace }}/.e2e-master-watch/requests.json
  count:
    description: Number of requests
    value: ${{ steps.plan.outputs.count }}
runs:
  using: composite
  steps:
    # Requests sent by earlier runs, so a spec still broken while its agent works is not requested twice.
    # The cache key and the .e2e-master-watch/ state directory keep the action's former name on purpose: the key
    # identifies the saved ledger, and a new name would restore nothing, so every saved request would be sent again.
    # The record action saves under a key unique to this run (caches can't be overwritten); this restores the newest.
    # The caller must queue its runs and allow cache writes: see the README.
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ github.workspace }}/.e2e-master-watch/ledger.json
        key: e2e-master-watch-${{ inputs.branch }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: e2e-master-watch-${{ inputs.branch }}-
    - id: plan
      shell: bash
      env:
        REPOSITORY: ${{ inputs.repository }}
        GH_RUN_ID: ${{ inputs.gh-run-id }}
        GH_RUN_ATTEMPT: ${{ inputs.gh-run-attempt }}
        BRANCH: ${{ inputs.branch }}
        SUITES: ${{ inputs.suites }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        LABEL: ${{ inputs.label }}
        EXTRA_LABELS: ${{ inputs.extra-labels }}
        MAX_BROKEN_PER_RUN: ${{ inputs.max-broken-per-run }}
        MAX_FLAKY_PER_DAY: ${{ inputs.max-flaky-per-day }}
        CAUSE_HOLD_HOURS: ${{ inputs.cause-hold-hours }}
        LEDGER_PATH: ${{ github.workspace }}/.e2e-master-watch/ledger.json
        PENDING_PATH: ${{ github.workspace }}/.e2e-master-watch/pending.json
        REQUESTS_PATH: ${{ github.workspace }}/.e2e-master-watch/requests.json
        TSIO_BASE_URL: ${{ inputs.tsio-base-url }}
      run: node "${{ github.action_path }}/dist/index.js"
