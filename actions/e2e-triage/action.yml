name: E2E triage
description: >
  After an E2E run reported to Test System IO, decide whether its failures are the
  PR's fault, ask Claude about the borderline ones with checkable evidence, and
  publish a job summary and structured verdict. Commit statuses require enforce
  mode; sticky PR comments are opt-in.
author: Mattermost
inputs:
  composite-identity:
    description: JSON with repository, commit_sha, gh_run_id, gh_run_attempt, name, branch and gh_pr_number (the same object the TSIO begin/summary actions receive)
    required: true
  status-context:
    description: Required commit-status context to write the final verdict to (e.g. e2e-test/playwright-full/enterprise)
    required: true
  github-token:
    description: Token for the diff, the PR comment and the commit status; never sent to TSIO or Anthropic
    required: true
  anthropic-api-key:
    description: Anthropic API key for the second judge; without it only the history rules run
    required: false
    default: ""
  claude-model:
    description: >
      Model for the second judge. Defaults to a dated snapshot rather than an
      alias, because the confidence thresholds are tuned against one model's
      behaviour and an alias can be repointed underneath them. An answer from any
      model other than the one requested is discarded and the deterministic
      verdict stands. Temperature is set to 0 only for models that accept it
      (Haiku 4.5, Opus 4.6, Sonnet 4.6); newer models reject it, so they run at
      the API default.
    required: false
    default: claude-haiku-4-5-20251001
  min-confidence:
    description: Minimum judge confidence (0.5-1) to clear a borderline failure; vetoes always need 0.9 plus a cited hunk
    required: false
    default: "0.85"
  mode:
    description: >
      enforce writes the commit status; report-only writes the job summary.
      PR comments are controlled separately by post-pr-comment.
      Report-only is the default: an omitted mode, or a repository
      variable that failed to expand, must not be the difference between
      describing a run and writing the status that gates merging. Enforcement is
      something a repository opts into explicitly.
    required: false
    default: report-only
  post-pr-comment:
    description: Set to true to create or update the optional sticky PR comment; disabled by default in both modes
    required: false
    default: "false"
  tsio-base-url:
    description: Test System IO base URL
    required: false
    default: https://test-io.test.mattermost.com
  test-root:
    description: >
      Where this producer's specs live relative to the repository root, or "."
      when TSIO already records repository-relative paths. TSIO stores a spec
      path relative to the test root while GitHub reports changed files relative
      to the repository, so without this the two never match and a pull request
      that edits the failing spec is not recognised as owning it. Leaving it
      unset makes ownership unknown, and nothing is cleared.
    required: false
    default: ""
  report-name:
    description: >
      Narrow the run to one report inside the group, matched as a prefix of the
      report name. A run that uploads one report per operating system needs this
      to attribute a failure, and to write a status per OS rather than one status
      covering all of them. A prefix matching no report fails the step rather than
      reporting a clean run.
    required: false
    default: ""
  lane:
    description: Optional lane label shown to the judge (defaults to the run name)
    required: false
    default: ""
outputs:
  verdict:
    description: SUCCESS, FAILURE or ACTION_REQUIRED (run-level investigation)
    value: ${{ steps.triage.outputs.verdict }}
  blocking:
    description: Number of unresolved failures, including insufficient evidence; not a count of proven PR regressions
    value: ${{ steps.triage.outputs.blocking }}
  exonerated:
    description: Number of failures cleared by history or the judge
    value: ${{ steps.triage.outputs.exonerated }}
  description:
    description: The commit-status description that was (or would be) written
    value: ${{ steps.triage.outputs.description }}
runs:
  using: composite
  steps:
    - id: triage
      shell: bash
      env:
        COMPOSITE_IDENTITY: ${{ inputs.composite-identity }}
        STATUS_CONTEXT: ${{ inputs.status-context }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        CLAUDE_MODEL: ${{ inputs.claude-model }}
        MIN_CONFIDENCE: ${{ inputs.min-confidence }}
        MODE: ${{ inputs.mode }}
        POST_PR_COMMENT: ${{ inputs.post-pr-comment }}
        TSIO_BASE_URL: ${{ inputs.tsio-base-url }}
        TEST_ROOT: ${{ inputs.test-root }}
        REPORT_NAME: ${{ inputs.report-name }}
        LANE: ${{ inputs.lane }}
      run: node "${{ github.action_path }}/../../scripts/e2e-triage.mjs"
