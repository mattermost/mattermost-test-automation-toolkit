---
name: E2E test triage
description: >
  After an E2E run reported to Test System IO, decide whether each failure is the
  PR's fault from test history, ask Claude about the ones history can't settle,
  and publish a job summary. In enforce mode, also write the commit status.
author: Mattermost
inputs:
  composite-identity:
    description: JSON with repository, commit_sha, gh_run_id, gh_run_attempt, name, branch and gh_pr_number (as given to the TSIO actions)
    required: true
  status-context:
    description: Required commit-status context the verdict is written to in enforce mode
    required: true
  github-token:
    description: Token for the PR diff and commit statuses; never sent to TSIO or Anthropic
    required: true
  anthropic-api-key:
    description: Anthropic API key; without it only the history rules run
    required: false
    default: ""
  claude-model:
    description: Model for the judge. The confidence thresholds are tuned against the default
    required: false
    default: claude-sonnet-5-5
  min-confidence:
    description: Minimum model confidence (0.5-1) to clear a failure history can't explain; a value outside that range is clamped to it, and one that is not a number is replaced by 0.85, both with a warning
    required: false
    default: "0.85"
  mode:
    description: '"enforce" sets the E2E check from the verdict; anything else (default report-only) writes triage''s line on the check but keeps its state'
    required: false
    default: report-only
  tsio-base-url:
    description: Test System IO base URL; empty for the shared instance
    required: false
    default: ""
  use-staging:
    description: >
      When true, target the staging deployment
      (https://staging-test-io.test.mattermost.com) instead of production
      (https://test-io.test.mattermost.com). Fails if tsio-base-url is set to any other URL.
    required: false
    default: "false"
  test-root:
    description: Where specs live relative to the repository root ("." if TSIO paths are repository-relative). Unset means ownership is unknown and nothing clears
    required: false
    default: ""
  report-name:
    description: Prefix of the one report in the run to triage (e.g. one per OS). Matching none fails the step
    required: false
    default: ""
  lane:
    description: Lane label shown to the model (defaults to the run name)
    required: false
    default: ""
  history-lane:
    description: >-
      Lane whose history the run is judged against, for a lane the base branch rarely runs
      (e.g. playwright-full-enterprise for a subpath suite); empty for the run's own lane
    required: false
    default: ""
  infra-clears:
    description: >-
      "true" clears a test whose own error is its environment (test server down, a proxy page
      instead of JSON): set it where the PR can't touch that environment (an app against a separate
      test server). Otherwise such a test is named but stays blocking.
    required: false
    default: "false"
  escalation-model:
    description: Stronger model (e.g. claude-fable-5-1) asked once about answers just short of a threshold, or that blame the PR without citing a change. Empty (the default) turns it off
    required: false
    default: ""
  ai-budget-usd:
    description: Per-run ceiling on model spend in USD; a call that could cross it is not made
    required: false
    default: "1"
  pr-budget-usd:
    description: Ceiling on model spend in USD for one PR across all its commits, split evenly between the lanes in triage-lanes. Needs answers-cache, keyed by PR number so it carries across commits
    required: false
    default: "2"
  report-only-label:
    description: A PR with this label gets report-only triage whatever the mode, so an author can make triage stricter on their PR, never looser. Empty turns it off
    required: false
    default: E2E/Triage-report-only
  ai-advice:
    description: '"true" also asks about blocking failures the model can''t clear, and shows its read as advice (never changes the outcome)'
    required: false
    default: "true"
  triage-status-context:
    description: Informational check, pending while triage runs and then the verdict (enforce mode only). Defaults to "<status-context>/triage"; "off" turns it off
    required: false
    default: ""
  triage-lanes:
    description: Comma-separated required contexts of every lane in the run. When set, the triage check is one for the whole PR (give all lanes the same triage-status-context), summarising every lane
    required: false
    default: ""
  ai-prices:
    description: 'Optional JSON of prices per million tokens merged over the built-in table: {"model": {"input", "output", "cache_write", "cache_read"}}'
    required: false
    default: ""
  answers-cache:
    description: Optional file of earlier answers, so a re-run with the same evidence doesn't pay again; it also keeps the lane's spend for pr-budget-usd. Persist it with actions/cache under a key with the lane and the PR number
    required: false
    default: ""
  evidence-dir:
    description: Optional directory of JSON evidence the test run recorded per failed test ({file, title, full_title, notes, images}); PNG/JPEG only, at most two per test
    required: false
    default: ""
  findings-file:
    description: Optional path of a JSON file triage writes after every run, judged or not, for measuring its accuracy (schema 1, see the README). Holds no secret and only the first line of each error. Empty turns it off
    required: false
    default: ""
outputs:
  published:
    description: Whether triage wrote its verdict to the required status
    value: ${{ steps.triage.outputs.published }}
  effective-mode:
    description: enforce or report-only, after applying the PR's report-only label
    value: ${{ steps.triage.outputs.effective_mode }}
  verdict:
    description: SUCCESS, FAILURE or ACTION_REQUIRED (run-level investigation)
    value: ${{ steps.triage.outputs.verdict }}
  blocking:
    description: Failures still blocking, including those with too little evidence
    value: ${{ steps.triage.outputs.blocking }}
  exonerated:
    description: Failures cleared by history or the model
    value: ${{ steps.triage.outputs.exonerated }}
  description:
    description: The commit-status description written (or that would be)
    value: ${{ steps.triage.outputs.description }}
  ai-calls:
    description: Model calls this run made
    value: ${{ steps.triage.outputs.ai_calls }}
  ai-cost-usd:
    description: Their cost in USD at list price, or "unknown" for an unpriced model
    value: ${{ steps.triage.outputs.ai_cost_usd }}
runs:
  using: composite
  steps:
    - id: triage
      if: ${{ !cancelled() }}
      shell: bash
      env:
        COMPOSITE_IDENTITY: ${{ inputs.composite-identity }}
        STATUS_CONTEXT: ${{ inputs.status-context }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        CLAUDE_MODEL: ${{ inputs.claude-model }}
        MIN_CONFIDENCE: ${{ inputs.min-confidence }}
        MODE: ${{ inputs.mode }}
        TSIO_BASE_URL: ${{ inputs.tsio-base-url }}
        USE_STAGING: ${{ inputs.use-staging }}
        TEST_ROOT: ${{ inputs.test-root }}
        REPORT_NAME: ${{ inputs.report-name }}
        LANE: ${{ inputs.lane }}
        EVIDENCE_DIR: ${{ inputs.evidence-dir }}
        ESCALATION_MODEL: ${{ inputs.escalation-model }}
        AI_BUDGET_USD: ${{ inputs.ai-budget-usd }}
        PR_BUDGET_USD: ${{ inputs.pr-budget-usd }}
        REPORT_ONLY_LABEL: ${{ inputs.report-only-label }}
        AI_ADVICE: ${{ inputs.ai-advice }}
        HISTORY_LANE: ${{ inputs.history-lane }}
        INFRA_CLEARS: ${{ inputs.infra-clears }}
        TRIAGE_CONTEXT: ${{ inputs.triage-status-context }}
        TRIAGE_LANES: ${{ inputs.triage-lanes }}
        AI_PRICES: ${{ inputs.ai-prices }}
        ANSWERS_CACHE: ${{ inputs.answers-cache }}
        FINDINGS_FILE: ${{ inputs.findings-file }}
      run: node "${{ github.action_path }}/dist/index.js"
