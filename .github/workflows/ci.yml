---
# CI for the toolkit's own scripts.
#
# Override is the only triage script left here — adjudication moved to
# mattermost-test-system-io's test-system-io-ai-triage action.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Script tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '22'

      - name: ci/test
        run: |
          node --test \
            scripts/triage-override.test.js

  actionlint:
    name: Workflow lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: ci/actionlint
        run: |
          set -euo pipefail
          INSTALLER_REF=3795ba2f6cb243eeca54c9d22e5c531cb9dcfb4a
          ACTIONLINT_VERSION=1.7.12
          curl -fsSL -o download-actionlint.bash \
            "https://raw.githubusercontent.com/rhysd/actionlint/${INSTALLER_REF}/scripts/download-actionlint.bash"
          bash download-actionlint.bash "${ACTIONLINT_VERSION}"
          ./actionlint -shellcheck= .github/workflows/*.yml
