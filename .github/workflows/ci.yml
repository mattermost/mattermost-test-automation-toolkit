name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# npm ci runs the root prepare script; husky installs git hooks only for local commits.
env:
  HUSKY: "0"

jobs:
  test:
    name: Action tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"
      - name: ci/shared-test
        run: node --experimental-strip-types --test actions/shared/src/*.test.ts
      # One install for every action: the workspaces in the root package.json share one lockfile.
      - name: ci/install
        run: npm ci
      # Every workspace but e2e-test-stack, on the Node they are built for; e2e-test-stack has its own job, on Node 26.
      - name: ci/check
        run: |
          list=$(node -p 'require("./package.json").workspaces.filter((w) => w !== "actions/e2e-test-stack").map((w) => "--workspace=" + w).join("\n")')
          [ -n "$list" ] || { echo "::error::package.json lists no workspace but e2e-test-stack"; exit 1; }
          mapfile -t workspaces <<< "$list"
          npm run fmt:check "${workspaces[@]}" --if-present
          npm run lint "${workspaces[@]}" --if-present
          npm run tsc "${workspaces[@]}"
          npm test "${workspaces[@]}"
          npm run build "${workspaces[@]}"
      - name: ci/dist
        run: |
          git diff --exit-code actions/*/dist/
          test -z "$(git status --porcelain --untracked-files=all actions/*/dist/)"

  e2e-test-stack:
    name: e2e-test-stack
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      # The e2e-test-stack actions run on Node 26 (see run.sh).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "26"
      # The bundle includes actions/shared, so its tests run on Node 26 too.
      - name: ci/shared-test
        run: node --experimental-strip-types --test actions/shared/src/*.test.ts
      - name: ci/install
        run: npm ci
      - name: ci/fmt
        run: npm run fmt:check -w actions/e2e-test-stack
      - name: ci/lint
        run: npm run lint -w actions/e2e-test-stack
      - name: ci/tsc
        run: npm run tsc -w actions/e2e-test-stack
      - name: ci/test
        run: npm test -w actions/e2e-test-stack
      - name: ci/build
        run: npm run build -w actions/e2e-test-stack
      - name: ci/dist
        run: |
          git diff --exit-code actions/e2e-test-stack/dist/
          test -z "$(git status --porcelain --untracked-files=all actions/e2e-test-stack/dist/)"

  yamllint:
    name: YAML lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      # yamllint ships with the ubuntu-24.04 runner image, as in the monorepo's yamllint job.
      - name: ci/yamllint
        run: yamllint .github/workflows/ actions/
