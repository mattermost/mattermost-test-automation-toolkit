name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Action tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903  # v6.0.0
        with:
          node-version: "24"
      - name: ci/shared-test
        run: node --experimental-strip-types --test actions/shared/src/*.test.ts
      # One install for every action: the workspaces in the root package.json share one lockfile.
      - name: ci/install
        run: npm ci
      - name: ci/tsc
        run: npm run tsc --workspaces
      - name: ci/test
        run: npm test --workspaces
      - name: ci/build
        run: npm run build --workspaces
      - name: ci/dist
        run: |
          git diff --exit-code actions/*/dist/
          test -z "$(git status --porcelain --untracked-files=all actions/*/dist/)"

  diff-bug-hunter:
    name: diff-bug-hunter self-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      # Runs only when the package or this workflow changed; runs anyway if the base can't be resolved.
      - name: ci/changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE_SHA" HEAD | grep -qE '^(packages/diff-bug-hunter/|\.github/workflows/ci\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.run == 'true'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version: "1.24"
          cache: false
      - if: steps.changes.outputs.run == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
      - if: steps.changes.outputs.run == 'true'
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903  # v6.0.0
        with:
          node-version: "24"
      - name: ci/install
        if: steps.changes.outputs.run == 'true'
        run: python -m pip install pytest==9.1.1 ruff==0.16.9 mypy==2.3.1
      - name: ci/lint
        if: steps.changes.outputs.run == 'true'
        run: make -C packages/diff-bug-hunter lint
      - name: ci/self-test
        if: steps.changes.outputs.run == 'true'
        run: make -C packages/diff-bug-hunter self-test

  yamllint:
    name: YAML lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      # yamllint ships with the ubuntu-24.04 runner image, as in the monorepo's yamllint job.
      - name: ci/yamllint
        run: yamllint .github/workflows/ actions/
