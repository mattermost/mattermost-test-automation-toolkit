name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    name: Action tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903  # v6.0.0
        with:
          node-version: "24"
      - name: ci/shared-test
        run: node --experimental-strip-types --test actions/shared/src/*.test.ts
      - name: ci/install
        run: npm ci
      - name: ci/tsc
        run: npm run tsc --workspaces
      - name: ci/test
        run: npm test --workspaces
      - name: ci/build
        run: |
          git checkout bb299ec33d010c5fd9f8ef7d7c53b829e497a2f3 -- actions/e2e-test-triage/README.md
          sed -i 's/out-of-date bucket ("merge and re-run"), because/out-of-date bucket ("merge and re-run") because/' actions/e2e-test-triage/README.md
          npm run build --workspaces
          git config user.name "yasser khan"
          git config user.email "attitude3cena.yf@gmail.com"
          git add actions/e2e-test-triage/README.md actions/*/dist/index.js
          git commit -m "chore(dist): rebuild action bundles and restore README"
          git push origin HEAD:refs/heads/fix/triage-hold-cross-platform-and-trunk-error
