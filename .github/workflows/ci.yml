name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Action tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903  # v6.0.0
        with:
          node-version: "24"
      - name: ci/shared-test
        run: node --experimental-strip-types --test actions/shared/src/*.test.ts
      # One install for every action: the workspaces in the root package.json share one lockfile.
      - name: ci/install
        run: npm ci
      - name: ci/tsc
        run: npm run tsc --workspaces
      - name: ci/test
        run: npm test --workspaces
      - name: ci/build
        run: npm run build --workspaces
      - name: ci/dist
        run: |
          git diff --exit-code actions/*/dist/
          test -z "$(git status --porcelain --untracked-files=all actions/*/dist/)"

  yamllint:
    name: YAML lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      # yamllint ships with the ubuntu-24.04 runner image, as in the monorepo's yamllint job.
      - name: ci/yamllint
        run: yamllint .github/workflows/ actions/
