---
name: E2E Test Stack Create
description: >
  Leases remote E2E test servers - isolated, short-lived Mattermost stacks,
  each reachable over HTTPS.

# Runs in the consuming job and uses the credentials that job holds. Assumes
# none itself: run aws-actions/configure-aws-credentials once in the job first.

inputs:
  instance_key:
    description: "Names the stack, and its hostname - 'pr-1234', 'main'. Lowercase letters, digits and hyphens, 24 characters or fewer. It prefixes every hostname the stack answers on."
    required: true
  server_image:
    description: "Mattermost server image on Docker Hub, by tag, e.g. mattermostdevelopment/mattermost-enterprise-edition:master. Name it without a registry host, and do not pin by digest - both are refused. This is what is under test."
    required: true
  count:
    description: "Instances to create, from 1 to 40. They are created concurrently, so a batch takes about as long as one."
    required: false
    default: "1"
  lambda_alias:
    description: "Leave as 'v1', the promoted build, unless you are proving a new build of the stack tooling itself - then use 'edge', the newest published. The agent comes with whichever is named."
    required: false
    default: "v1"
  services:
    description: "Comma-separated optional services, e.g. 'keycloak,minio'. One or more of: minio or azurite, elasticsearch or opensearch, keycloak, openldap. Each 'or' pair sets the same boot setting, so only one of each may run. Empty runs Postgres, Inbucket and the server alone. Everything at once is 'minio,elasticsearch,keycloak,openldap'."
    required: false
    default: ""
  ttl:
    description: "How long the stack lives before the reaper takes it - '90m', '4h'. The control plane's ceiling is 4h."
    required: false
    default: "1h"
  os:
    description: "Operating system the stack runs on: 'ubuntu-24.04' or 'ubuntu-26.04'."
    required: false
    default: "ubuntu-24.04"
  postgres:
    description: "Postgres major version or release to run: '14', '15', '16', '17', '18'. Empty uses the pin's default (currently 16). Refused if the version has no mirror."
    required: false
    default: ""
  license:
    description: "Licence SKU to apply: 'enterprise-advanced'. Empty runs unlicensed, leaving the server to request a trial. The set is provisioned per deployment, so an unknown SKU is refused with the list that exists."
    required: false
    default: ""
  server_env:
    description: "Server settings to override at boot, as a JSON object - '{\"MM_FEATUREFLAGS_TESTFEATURE\":\"true\"}'. Merged over the baseline; settings the stack computes for itself cannot be overridden."
    required: false
    default: ""
  wait_for_migrations:
    description: "Wait for server migrations to finish before reporting ready."
    required: false
    default: "false"
  shared_admin_password:
    description: "Give every instance in the batch the same admin password."
    required: false
    default: "false"

outputs:
  batch_id:
    description: "Handle that addresses this batch."
    value: ${{ steps.invoke.outputs.batch_id }}
  sites:
    description: "JSON array of site URLs, one per instance, in the order they were created."
    value: ${{ steps.invoke.outputs.sites }}
  ready:
    description: "How many instances came up ready."
    value: ${{ steps.invoke.outputs.ready }}
  response_artifact:
    description: "Name of the uploaded artifact holding the full create response. Download it in a later job to read site URLs, admin credentials, and service credentials without a separate fetch call."
    value: e2e-create-${{ steps.invoke.outputs.batch_id }}

runs:
  using: composite
  steps:
    - name: ci/check-inputs
      shell: bash
      env:
        INSTANCE_KEY: ${{ inputs.instance_key }}
        LAMBDA_ALIAS: ${{ inputs.lambda_alias }}
        SERVER_IMAGE: ${{ inputs.server_image }}
        COUNT: ${{ inputs.count }}
        WAIT_FOR_MIGRATIONS: ${{ inputs.wait_for_migrations }}
        SHARED_ADMIN_PASSWORD: ${{ inputs.shared_admin_password }}
        SERVER_ENV: ${{ inputs.server_env }}
        POSTGRES_TAG: ${{ inputs.postgres }}
      run: |
        # required: true is advisory on an action input - the runner does not
        # enforce it - so what must be present is checked here.
        case "$LAMBDA_ALIAS" in
          v1 | edge) ;;
          *)
            echo "::error::lambda_alias must be 'v1' or 'edge', got '${LAMBDA_ALIAS}'"
            exit 1
            ;;
        esac

        if [ -z "$INSTANCE_KEY" ]; then
          echo "::error::instance_key is required; it names the stack, e.g. pr-1234"
          exit 1
        fi

        # Shorter than the control plane allows: the key prefixes every hostname,
        # and a long one makes every URL in a test report unreadable.
        if [ "${#INSTANCE_KEY}" -gt 24 ]; then
          echo "::error::instance_key is ${#INSTANCE_KEY} characters; keep it to 24 or fewer"
          exit 1
        fi

        if [ -z "$SERVER_IMAGE" ]; then
          echo "::error::server_image is empty; name the image under test, e.g. mattermostdevelopment/mattermost-enterprise-edition:master"
          exit 1
        fi

        case "$COUNT" in
          '' | *[!0-9]*)
            echo "::error::count must be a whole number, got '${COUNT}'"
            exit 1
            ;;
        esac
        if [ "$COUNT" -lt 1 ]; then
          echo "::error::count must be at least 1, got ${COUNT}"
          exit 1
        fi
        if [ "$COUNT" -gt 40 ]; then
          echo "::error::count is above the ceiling of 40, got ${COUNT}"
          exit 1
        fi

        # An action input is a string whatever the caller wrote, and these two
        # reach the payload as JSON booleans. Anything else is either not JSON,
        # which fails while naming jq instead of the input, or is JSON that jq
        # reads as true.
        case "$WAIT_FOR_MIGRATIONS" in
          true | false) ;;
          *)
            echo "::error::wait_for_migrations must be 'true' or 'false', got '${WAIT_FOR_MIGRATIONS}'"
            exit 1
            ;;
        esac

        case "$SHARED_ADMIN_PASSWORD" in
          true | false) ;;
          *)
            echo "::error::shared_admin_password must be 'true' or 'false', got '${SHARED_ADMIN_PASSWORD}'"
            exit 1
            ;;
        esac

        # Reaches the payload as an object, so it is checked here where the
        # message can name the input.
        if [ -n "$SERVER_ENV" ]; then
          if ! jq -e 'type == "object"' <<< "$SERVER_ENV" > /dev/null 2>&1; then
            echo "::error::server_env must be a JSON object, e.g. {\"MM_FEATUREFLAGS_TESTFEATURE\":\"true\"}"
            exit 1
          fi
        fi

        if [ -n "$POSTGRES_TAG" ]; then
          if ! echo "$POSTGRES_TAG" | grep -qE '^[0-9]+(\.[0-9]+)*$'; then
            echo "::error::postgres must be a version like '16' or '16.14', got '${POSTGRES_TAG}'"
            exit 1
          fi
        fi

    - name: ci/invoke-create
      id: invoke
      shell: bash
      env:
        INSTANCE_KEY: ${{ inputs.instance_key }}
        COUNT: ${{ inputs.count }}
        SERVER_IMAGE: ${{ inputs.server_image }}
        SERVICES: ${{ inputs.services }}
        TTL: ${{ inputs.ttl }}
        OS_VARIANT: ${{ inputs.os }}
        LICENSE: ${{ inputs.license }}
        WAIT_FOR_MIGRATIONS: ${{ inputs.wait_for_migrations }}
        SHARED_ADMIN_PASSWORD: ${{ inputs.shared_admin_password }}
        SERVER_ENV: ${{ inputs.server_env }}
        POSTGRES_TAG: ${{ inputs.postgres }}
        LAMBDA_ALIAS: ${{ inputs.lambda_alias }}
      run: |
        set -euo pipefail

        # Under RUNNER_TEMP, not the workspace: the response carries an admin
        # password per instance, and a workspace is what a consumer checks out,
        # uploads and archives.
        payload="${RUNNER_TEMP}/e2e-create-payload.json"
        response="${RUNNER_TEMP}/e2e-create-response.json"
        invoke="${RUNNER_TEMP}/e2e-create-invoke.json"
        echo "response=${response}" >> "$GITHUB_OUTPUT"

        # jq builds the payload, so an input carrying a quote cannot change its
        # shape. Empty strings are dropped, leaving the control plane to apply
        # its own defaults.
        jq -nc \
          --arg instance_key "$INSTANCE_KEY" \
          --argjson count "$COUNT" \
          --arg server_image "$SERVER_IMAGE" \
          --arg services "$SERVICES" \
          --arg ttl "$TTL" \
          --arg os "$OS_VARIANT" \
          --arg postgres "$POSTGRES_TAG" \
          --arg license "$LICENSE" \
          --argjson wait_for_migrations "$WAIT_FOR_MIGRATIONS" \
          --argjson shared_admin_password "$SHARED_ADMIN_PASSWORD" \
          --argjson server_env "${SERVER_ENV:-null}" \
          '{action: "create", instance_key: $instance_key, count: $count,
            server_image: $server_image}
           + (if $services == "" then {} else {services: ($services | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(. != "")))} end)
           + (if $ttl == "" then {} else {ttl: $ttl} end)
           + (if $os == "" then {} else {os: $os} end)
           + (if $postgres == "" then {} else {postgres: $postgres} end)
           + (if $license == "" then {} else {license: $license} end)
           + (if $wait_for_migrations then {wait_for_migrations: true} else {} end)
           + (if $server_env == null then {} else {server_env: $server_env} end)
           + (if $shared_admin_password then {shared_admin_password: true} else {} end)' \
          > "$payload"

        echo "Payload:"
        jq . "$payload"

        # botocore gives up after 60 seconds by default, on a call that is still
        # working. This is above the function's own ceiling, so the CLI never
        # abandons a create that is still running.
        set +e
        aws lambda invoke \
          --function-name "e2e-test-stack:${LAMBDA_ALIAS}" \
          --cli-read-timeout 960 \
          --cli-connect-timeout 60 \
          --cli-binary-format raw-in-base64-out \
          --payload "file://${payload}" \
          "$response" > "$invoke"
        invoke_status=$?
        set -e

        if [ $invoke_status -ne 0 ]; then
          echo "::error::the invocation itself failed"
          cat "$invoke" 2>/dev/null || true
          exit 1
        fi

        batch_id=$(jq -r '.batch_id // ""' "$response")
        {
          echo "batch_id=${batch_id}"
          echo "sites=$(jq -c '.sites // []' "$response")"
          echo "ready=$(jq -r '.batch.ready // 0' "$response")"
        } >> "$GITHUB_OUTPUT"

        # A handler error is not an invocation error: the CLI exits 0 and says
        # so here instead. Reported after the outputs are set, so a partial
        # create still hands back the batch id its instances need to be
        # destroyed by.
        # A handler that returns an error answers with {"errorMessage": ...}
        # from the Go runtime, not the response read below, so both are tried.
        if jq -e 'has("FunctionError")' "$invoke" > /dev/null; then
          echo "::error::the control plane returned an error"
          jq -r '.errorMessage // .error // "no reason given"' "$response"
          exit 1
        fi
        if [ -n "$(jq -r '.error // ""' "$response")" ]; then
          echo "::error::$(jq -r .error "$response")"
          exit 1
        fi
        if [ -z "$batch_id" ]; then
          echo "::error::no batch id in the response"
          exit 1
        fi

    # Time to ready per instance, so a slow member of a batch is visible without
    # reading the response.
    - name: ci/summary
      if: always() && steps.invoke.outputs.batch_id != ''
      shell: bash
      env:
        RESPONSE: ${{ steps.invoke.outputs.response }}
      run: |
        set -euo pipefail
        cat > "${RUNNER_TEMP}/e2e-create-summary.jq" <<'SUMMARY'
        def secs: if . == null then "—" else (. * 100 | round / 100 | tostring) + "s" end;
        # The registry host embeds the account id, and the cache namespace is noise.
        def image: gsub("[a-z0-9.-]*\\.amazonaws\\.com/(dockerhub/)?"; "");
        # A connection string carries the password it connects with. Masking covers the
        # log and not this file, so it is taken out here.
        def nocreds: gsub("://(?<u>[^:/@]+):[^@]+@"; "://\(.u):***@");
        # One cell, whatever the shape: a list joins, an object reads as pairs.
        def show:
          (if type == "array" then join(", ")
           elif type == "object" then
             (to_entries | map(.key + "=" + (.value | tostring)) | join(", "))
           else tostring end)
          | image | nocreds;

        . as $r
        | [ .batch.instances[]? | select(. != null) ] as $live
        | [ $live[].timing.phases[]? | .name ] | unique as $phases
        | [ $live[].service_seconds // {} | keys[] ] | unique as $services
        | $live[0] as $first
        |
        "### E2E test stack — " + ($r.batch.state // "unknown"),
        "",
        "| | |",
        "|---|---|",
        "| Batch | `" + ($r.batch_id // "—") + "` |",
        "| Ready | " + (($live | map(select(.state == "ready")) | length) | tostring)
                     + " of " + (($r.batch.instances | length) | tostring) + " |",
        "| Wall clock | " + ($r.batch.timing.total_seconds | secs) + " |",
        "| Expires | " + ($r.batch.expires_at // "—") + " |",
        "| Instance | " + ($live | map(.instance_type) | unique | join(", ")) + " |",
        "| Image | `" + ($live | map(.ami_name // .ami) | unique | join(", ")) + "` |",
        "| Image built | " + ($first.ami_built_at // "unknown") + " |",
        "| Licensed | " + (($live | map(.licensed) | all) | tostring) + " |",
        "| Build | `" + ($r.deployment.build // "—") + "` |",
        "",
        ( if $r.request_payload == null then empty
          else
            ( "#### Requested",
              "",
              "| Field | Sent | Resolved |",
              "|---|---|---|",
              ( ( [ $r.request_payload // {} | keys[] ]
                  + [ $r.request_resolved // {} | keys[] ] | unique )[]
                | select(. != "action")
                | . as $k
                | ($r.request_payload[$k]) as $sent
                | ($r.request_resolved[$k]) as $got
                | "| `" + $k + "` | "
                  + (if $sent == null then "—" else "`" + ($sent | show) + "`" end)
                  + " | "
                  + (if $got == null then "—" else "`" + ($got | show) + "`" end)
                  + " |" ),
              "",
              "A dash under Sent is a default the control plane filled in." )
          end ),
        "",
        "#### Time to ready",
        "",
        "| Instance | Ready in | Critical path | Decided by |",
        "|---|---|---|---|",
        ( $live[] | "| `" + .instance_id + "` | " + (.timing.total_seconds | secs) + " | "
            + ((.critical_path.chain // []) | join(" → ")) + " | "
            + (.critical_path.decided_by // "—") + " at " + (.critical_path.seconds | secs) + " |" ),
        "",
        "#### Time by phase",
        "",
        "| Phase | Fastest | Slowest |",
        "|---|---|---|",
        ( $phases[] as $p
          | [ $live[].timing.phases[]? | select(.name == $p) | .seconds ] as $v
          | "| " + $p + " | " + ($v | min | secs) + " | " + ($v | max | secs) + " |" ),
        "",
        "#### Services",
        "",
        "| Service | Fastest | Slowest |",
        "|---|---|---|",
        ( $services[] as $s
          | [ $live[].service_seconds[$s] // empty ] as $v
          | "| " + $s + " | " + ($v | min | secs) + " | " + ($v | max | secs) + " |" ),
        "",
        "#### Server image",
        "",
        "| | |",
        "|---|---|",
        "| Reference | `" + (($first.server_image.ref // "—") | image) + "` |",
        "| Digest | `" + (($first.server_image.digest // "—")[0:26]) + "…` |",
        "| Built | " + ($first.server_image.age // "unknown") + " |",
        "| Pulled in | " + (($live | map(.image_pull_seconds) | max) | secs)
            + (if ($live | map(.image_pulled) | any) then "" else " (cached)" end) + " |",
        "",
        "#### Containers",
        "",
        ( ($first.containers // [])[] | "- `" + (. | image) + "`" ),
        "",
        "#### Server environment",
        "",
        "<details><summary>" + (($first.server_env // {} | length) | tostring) + " settings</summary>",
        "",
        "| Setting | Value |",
        "|---|---|",
        ( $first.server_env // {} | to_entries[] | "| `" + .key + "` | `" + (.value | image | nocreds) + "` |" ),
        "",
        "</details>",
        "",
        "#### Sites",
        "",
        ( $r.sites[]? | "- " + . )
        SUMMARY
        jq -r -f "${RUNNER_TEMP}/e2e-create-summary.jq" "$RESPONSE" >> "$GITHUB_STEP_SUMMARY"

    - name: ci/upload-response
      if: always() && steps.invoke.outputs.batch_id != ''
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: e2e-create-${{ steps.invoke.outputs.batch_id }}
        path: ${{ steps.invoke.outputs.response }}
        if-no-files-found: warn
