---
name: E2E Test Stack Destroy
description: >
  Releases a batch leased by e2e-test-stack-create, and reports what it cost.

# Run it with if: always() so a failed test step still releases what it leased.
# A batch that is already gone is not an error, so a teardown over stale ids is
# safe to repeat.
#
# Uses the credentials the job holds: run aws-actions/configure-aws-credentials
# once in the job first.

inputs:
  batch_id:
    description: "Batch to destroy, as returned by e2e-test-stack-create."
    required: true
  lambda_alias:
    description: "Leave as 'v1' unless the batch was created with 'edge'. Must match whatever created it."
    required: false
    default: "v1"
  caller_repository:
    description: "Repository that created the batch (github.repository from that run). Defaults to this job's repository. Required when destroy runs in a different repository than create."
    required: false
    default: ""
  caller_run_id:
    description: "github.run_id of the create workflow. Defaults to this job's run id (same-run teardown). Required when destroy is a separate workflow_dispatch."
    required: false
    default: ""

outputs:
  state:
    description: "'destroyed', or 'gone' when the batch had already been taken."
    value: ${{ steps.invoke.outputs.state }}
  sites:
    description: >
      JSON array of the sites this batch had, one per instance, so a caller can
      check they stopped serving. Empty for an instance that never launched, and
      empty overall for a batch that was already gone.
    value: ${{ steps.invoke.outputs.sites }}

runs:
  using: composite
  steps:
    - name: ci/invoke-destroy
      id: invoke
      shell: bash
      env:
        BATCH_ID: ${{ inputs.batch_id }}
        LAMBDA_ALIAS: ${{ inputs.lambda_alias }}
        CALLER_REPOSITORY: ${{ inputs.caller_repository != '' && inputs.caller_repository || github.repository }}
        CALLER_RUN_ID: ${{ inputs.caller_run_id != '' && inputs.caller_run_id || github.run_id }}
      run: |
        set -euo pipefail

        case "$LAMBDA_ALIAS" in
          v1 | edge) ;;
          *)
            echo "::error::lambda_alias must be 'v1' or 'edge', got '${LAMBDA_ALIAS}'"
            exit 1
            ;;
        esac

        # An empty batch id means the create never got far enough to report one.
        # Nothing to destroy, and whatever it launched is left to its TTL.
        if [ -z "$BATCH_ID" ]; then
          echo "::error::batch_id is empty; nothing to destroy, and any instances created are left to their TTL"
          exit 1
        fi

        payload="${RUNNER_TEMP}/e2e-destroy-payload.json"
        response="${RUNNER_TEMP}/e2e-destroy-response.json"
        invoke="${RUNNER_TEMP}/e2e-destroy-invoke.json"
        echo "response=${response}" >> "$GITHUB_OUTPUT"

        jq -nc \
          --arg batch_id "$BATCH_ID" \
          --arg caller_repository "$CALLER_REPOSITORY" \
          --arg caller_run_id "$CALLER_RUN_ID" \
          '{action: "destroy", batch_id: $batch_id,
            caller_repository: $caller_repository, caller_run_id: $caller_run_id}' \
          > "$payload"

        set +e
        aws lambda invoke \
          --function-name "e2e-test-stack:${LAMBDA_ALIAS}" \
          --cli-read-timeout 960 \
          --cli-connect-timeout 60 \
          --cli-binary-format raw-in-base64-out \
          --payload "file://${payload}" \
          "$response" > "$invoke"
        invoke_status=$?
        set -e

        if [ $invoke_status -ne 0 ]; then
          echo "::error::the invocation itself failed; ${BATCH_ID} may still be running"
          cat "$invoke" 2>/dev/null || true
          exit 1
        fi

        # A handler that returns an error answers with {"errorMessage": ...}
        # from the Go runtime, not the response read below, so both are tried.
        if jq -e 'has("FunctionError")' "$invoke" > /dev/null; then
          echo "::error::the control plane returned an error; ${BATCH_ID} may still be running"
          jq -r '.errorMessage // .error // "no reason given"' "$response"
          exit 1
        fi

        # 'gone' means another destroy, or the reaper, got there first. The
        # control plane returns it as a value, so repeating a teardown over
        # stale ids passes.
        state=$(jq -r '.batch.state // "destroyed"' "$response")
        {
          echo "state=${state}"
          echo "sites=$(jq -c '.sites // []' "$response")"
        } >> "$GITHUB_OUTPUT"
        echo "${BATCH_ID}: ${state}"

    # What the batch cost. The only place it is reported: a destroyed batch
    # leaves no other trace a consumer can see.
    - name: ci/summary
      if: always() && steps.invoke.outputs.state != ''
      shell: bash
      env:
        RESPONSE: ${{ steps.invoke.outputs.response }}
      run: |
        set -euo pipefail
        cat > "${RUNNER_TEMP}/e2e-destroy-summary.jq" <<'SUMMARY'
        def money: if . == null then "—" else (. * 10000 | round / 10000 | tostring) end;
        def secs: if . == null then "—" else (. * 100 | round / 100 | tostring) + "s" end;
        def pct: if . == null then "—" else (. * 10 | round / 10 | tostring) + "%" end;
        def cur: if (. // "") == "" then "USD" else . end;

        . as $r
        | [ .batch.instances[]? | select(. != null) ] as $live
        | .batch.cost as $c
        | .batch.sizing as $s
        |
        "### E2E test stack released",
        "",
        "| | |",
        "|---|---|",
        "| Batch | `" + ($r.batch_id // "—") + "` |",
        "| State | " + ($r.batch.state // "unknown") + " |",
        "| Instances | " + (($r.batch.instances // [] | length) | tostring) + " |",
        "| Leased for | " + (if $c.hours then (($c.hours * 60 * 10 | round / 10) | tostring) + " min" else "—" end) + " |",
        ( if $c == null then "| Cost | — |"
          else "| Cost | **" + ($c.total // 0 | money) + " " + ($c.currency | cur) + "**"
               + (if $c.estimated then " (estimated)" else "" end) + " |"
          end ),
        "",
        ( if $c == null then "Nothing was running to price."
          else
            ( "#### Cost (" + ($c.currency | cur) + ")",
              "",
              "| | Batch |",
              "|---|---|",
              "| Compute | " + ($c.compute // 0 | money) + " |",
              "| Storage | " + ($c.storage // 0 | money) + " |",
              "| Transfer | " + ($c.transfer // 0 | money) + " |",
              "| Burst surcharge | " + ($c.surcharge // 0 | money) + " |",
              "| **Total** | **" + ($c.total // 0 | money) + "** |",
              "",
              "Rates checked " + ($c.rates_checked // "unknown") + " for " + ($c.rates_region // "unknown")
                + ". The burst surcharge is measured from CloudWatch; the rest is estimated." )
          end ),
        "",
        ( if $s == null then empty
          else
            ( "#### Sizing",
              "",
              "Sustained CPU was " + ($s.sustained_cpu | pct)
                + (if $s.crossover then ", against a crossover of " + (($s.crossover * 100) | round | tostring) + "%" else "" end) + ".",
              "",
              ( if ($s.saving // 0) > 0 then
                  "`" + $s.alternative + "` would have cost " + ($s.counterfactual | money)
                  + " against " + ($s.actual | money) + " — **" + ($s.saving | money) + " saved per instance.**"
                elif ($s.note // "") != "" then $s.note
                else "The type chosen was already the cheaper one for this load."
                end ) )
          end ),
        "",
        ( if ($live | length) == 0 then empty
          else
            ( "#### Instances",
              "",
              "| Instance | Type | Ready in | Leased | CPU avg | CPU peak | Cost |",
              "|---|---|---|---|---|---|---|",
              ( $live[] | "| `" + .instance_id + "` | " + (.instance_type // "—") + " | "
                  + (.timing.total_seconds | secs) + " | "
                  + (if .cost.hours then ((.cost.hours * 60 * 10 | round / 10) | tostring) + " min" else "—" end) + " | "
                  + (.metrics.cpu_average | pct) + " | " + (.metrics.cpu_peak | pct) + " | "
                  + (.cost.total // 0 | money) + " |" ) )
          end )
        SUMMARY
        jq -r -f "${RUNNER_TEMP}/e2e-destroy-summary.jq" "$RESPONSE" >> "$GITHUB_STEP_SUMMARY"

    - name: ci/redact-response
      id: redact-response
      if: always() && steps.invoke.outputs.state != ''
      shell: bash
      env:
        RESPONSE: ${{ steps.invoke.outputs.response }}
        BATCH_ID: ${{ inputs.batch_id }}
      run: |
        set -euo pipefail
        redacted="${RUNNER_TEMP}/e2e-destroy-${BATCH_ID}-response.json"
        # The destroy response carries no credentials, but strip admin and
        # credentials keys defensively in case the shape ever changes.
        jq '
          .batch.instances |= map(
            if . == null then . else del(.admin, .credentials) end
          )
        ' "$RESPONSE" > "$redacted"
        echo "path=${redacted}" >> "$GITHUB_OUTPUT"

    - name: ci/upload-response
      if: always() && steps.redact-response.outputs.path != ''
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: e2e-destroy-${{ inputs.batch_id }}
        path: ${{ steps.redact-response.outputs.path }}
        if-no-files-found: warn
